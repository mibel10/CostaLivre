export_path="build/android/costa-livre.apk"

[preset.0.options]
custom_template/debug=".build-tools/godot-4.7.2/android_debug.apk"
custom_template/release=".build-tools/godot-4.7.2/android_release.apk"
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=8
version/name="1.5.1"
package/unique_name="com.costalivre.game"
